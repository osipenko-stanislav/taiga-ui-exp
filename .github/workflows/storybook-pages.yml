name: Publish OTUS Storybook

on:
  push:
    branches: [main, experiments/colors]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otus-storybook-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'osipenko-stanislav/taiga-ui-exp'
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
      NX_NO_CLOUD: 'true'
      STORYBOOK_BASE_HREF: /taiga-ui-exp/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run:
          npx jest --config package.json --runInBand --coverage=false --runTestsByPath
          projects/core/tokens/test/otus-defaults.spec.ts
          projects/core/components/button/test/button-motion.directive.spec.ts projects/icons/test/otus-icons.spec.ts
      - run: npm run build:storybook
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/storybook

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
