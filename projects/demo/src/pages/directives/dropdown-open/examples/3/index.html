<button
    tuiChevron
    tuiDropdownAlign="end"
    tuiLink
    type="button"
    class="link"
    [iconStart]="ascending ? '@otus.outline.chevron-up-lined' : '@otus.outline.chevron-down-lined'"
    [textContent]="primary"
    [tuiDropdown]="dropdown"
    [(tuiDropdownOpen)]="open"
></button>

<ng-template #dropdown>
    <tui-data-list>
        @for (group of items; track group) {
            <tui-opt-group>
                @for (item of group; track item) {
                    <button
                        tuiOption
                        type="button"
                        class="item"
                        (click)="onClick(item)"
                    >
                        {{ item }}
                        @if (itemIsActive(item)) {
                            <tui-icon icon="@otus.outline.check-lined" />
                        }
                    </button>
                }
            </tui-opt-group>
            <hr />
        }
    </tui-data-list>
</ng-template>
