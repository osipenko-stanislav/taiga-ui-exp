<span
    appearance="primary"
    tuiChip
    class="fade"
>
    <div tuiFade>Very long value in chip</div>
    <div>{{ 123000 | tuiAmount: 'RUB' }}</div>
</span>

<span
    appearance="accent"
    iconStart="@otus.outline.box-lined"
    tuiChip
>
    <div class="ellipsis">Very long value in chip</div>
</span>

<tui-badged-content>
    <tui-badge-notification
        size="xs"
        tuiSlot="top"
    />
    <span
        appearance="secondary"
        iconStart="@otus.outline.bell-01-lined"
        tuiChip
    >
        Notifications
    </span>
</tui-badged-content>

<span
    appearance="custom"
    iconEnd="@otus.outline.thumbs-up-lined"
    tuiChip
>
    Customized chip
</span>

<span
    tuiChip
    [appearance]="selected ? 'primary' : 'neutral'"
>
    Toggle chip
    <button
        iconStart="@otus.outline.plus-lined"
        tuiIconButton
        type="button"
        class="toggle"
        [style.transform]="selected ? 'rotate(45deg)' : 'rotate(0)'"
        (click)="selected = !selected"
    >
        Toggle
    </button>
</span>
