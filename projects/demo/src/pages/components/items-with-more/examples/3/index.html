<tui-items-with-more
    side="start"
    [itemsLimit]="3"
>
    @for (item of items; track item) {
        <ng-container *tuiItem>
            @if (!$first) {
                <tui-icon
                    icon="@otus.outline.chevron-right-lined"
                    [style.font-size.rem]="1"
                    [style.opacity]="0.25"
                    [style.width.rem]="1.5"
                />
            }
            <button
                appearance="flat"
                size="xs"
                tuiButton
                type="button"
            >
                {{ item }}
            </button>
        </ng-container>
    }
    <ng-template
        let-index
        tuiMore
    >
        <button
            appearance="flat"
            iconStart="@otus.outline.dots-horizontal-lined"
            size="xs"
            tuiDropdownAuto
            tuiIconButton
            type="button"
            [tuiDropdown]="dropdown"
        >
            More
        </button>
        <ng-template #dropdown>
            <tui-data-list size="s">
                @for (item of items; track item) {
                    @if ($index < index) {
                        <button
                            tuiOption
                            type="button"
                        >
                            {{ item }}
                        </button>
                    }
                }
            </tui-data-list>
        </ng-template>
    </ng-template>
</tui-items-with-more>
