<label tuiLabel>
    I am a label
    <tui-textfield
        iconStart="@otus.outline.user-01-lined"
        tuiChevron
        tuiTextfieldSize="m"
        [tuiTextfieldCleaner]="false"
    >
        <input
            placeholder="I am placeholder"
            tuiSelect
            [(ngModel)]="value"
        />

        <tui-data-list-wrapper
            *tuiDropdown
            [items]="users"
        />

        @if (value) {
            <tui-icon
                icon="@otus.outline.check-verified-01-lined"
                style="color: var(--tui-status-info); pointer-events: none"
            />
        }

        <tui-icon tuiTooltip="I am a hint" />
    </tui-textfield>
</label>
