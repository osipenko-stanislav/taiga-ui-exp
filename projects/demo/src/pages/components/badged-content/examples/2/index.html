<tui-badged-content [style.--tui-radius.%]="50">
    <tui-badge-notification
        size="s"
        tuiSlot="top"
    >
        8
    </tui-badge-notification>
    <div
        size="s"
        tuiAvatar="@otus.outline.user-01-lined"
    ></div>
</tui-badged-content>

<tui-badged-content [style.--tui-radius.%]="50">
    <tui-icon
        appearance="accent"
        iconStart="@otus.outline.star-01-lined"
        size="m"
        tuiBadge
        tuiSlot="bottom"
    />
    <div
        size="m"
        tuiAvatar="@otus.outline.user-01-lined"
    ></div>
</tui-badged-content>

<tui-badged-content [style.--tui-radius.%]="50">

    >
        Taiga
    </span>
    <div
        size="l"
        tuiAvatar="@otus.outline.user-01-lined"
    ></div>
</tui-badged-content>

<tui-badged-content [style.--tui-radius.%]="50">
