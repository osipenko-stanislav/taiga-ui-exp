<div
    tuiAppearance="floating"
    tuiButtonGroup
>
    <button type="button">
        <tui-icon icon="@otus.outline.plus-circle-lined" />
        Create a payment
    </button>

    <button type="button">
        <tui-icon
            badge=""
            icon="@otus.outline.plus-circle-lined"
        />
        Pay the bill
    </button>

    <button type="button">
        <tui-icon
            badge="@otus.outline.lock-01-lined"
            icon="@otus.outline.plus-circle-lined"
            class="custom"
        />
        Remove from favorites
    </button>
</div>

<div
    tuiAppearance="floating"
    tuiButtonGroup
>
    <button type="button">
        <tui-icon icon="@otus.outline.plus-circle-lined" />
        Top up
    </button>

    <button type="button">
        <tui-icon icon="@otus.outline.arrow-circle-right-lined" />
        Take out
    </button>
</div>

<div
    tuiAppearance="floating"
    tuiButtonGroup
>
    <button type="button">
        <tui-icon icon="@otus.outline.plus-circle-lined" />
        To repay
    </button>
</div>
