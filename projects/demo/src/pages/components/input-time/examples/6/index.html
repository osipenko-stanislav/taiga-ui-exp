<tui-textfield
    iconStart="@otus.outline.alarm-clock-lined"
    tuiTextfieldSize="m"
    [tuiTextfieldCleaner]="false"
>
    <label tuiLabel>I am a label</label>

    <input
        placeholder="I am placeholder"
        tuiInputTime
        [(ngModel)]="value"
    />

    @if (value) {
        <tui-icon [icon]="value.hours < 8 ? '@otus.outline.moon-01-lined' : '@otus.outline.sun-lined'" />
    }

    <tui-icon tuiTooltip="I am a hint" />
</tui-textfield>
