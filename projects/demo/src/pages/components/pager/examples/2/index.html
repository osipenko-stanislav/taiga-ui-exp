<tui-pager
    [count]="count"
    [index]="activeIndex"
    [valueContent]="content"
/>

<ng-template
    #content
    let-index
>
    @if (index === count - 2) {
        <tui-icon icon="@otus.outline.glasses-01-lined" />
    }

    @if (index === count - 1) {
        <tui-icon icon="@otus.outline.plus-square-lined" />
    }
</ng-template>

<div class="tui-space_top-3">
    <button
        size="xs"
        tuiButton
        type="button"
        (click)="prev()"
    >
        prev
    </button>
    <button
        size="xs"
        tuiButton
        type="button"
        class="tui-space_left-3"
        (click)="next()"
    >
        next
    </button>
</div>
