<button
    iconStart="@otus.outline.phone-lined"
    tuiButton
    type="button"
    (click)="open.set(true)"
>
    Call us
</button>
<ng-template
    let-observer
    [tuiPopoutOptions]="{pip: true, features: {height: 480, width: 320}}"
    [(tuiPopout)]="open"
>
    <main tuiTheme="dark">
        <div
            size="xl"
            tuiAvatar="@otus.outline.user-01-lined"
        ></div>
        <header tuiHeader="body-l">
            <hgroup tuiTitle>
                <h1>Taiga Headquarters</h1>
                <p tuiSubtitle>Calling...</p>
            </hgroup>
        </header>
        <section>
            <button
                appearance="warning"
                size="l"
                title="Headset"
                tuiAvatar="@otus.outline.headphones-01-lined"
                type="button"
            ></button>
            <button
                appearance="negative"
                size="l"
                title="Hang up"
                tuiAvatar="@otus.outline.phone-x-lined"
                type="button"
                (click)="observer.complete()"
            ></button>
        </section>
    </main>
</ng-template>
