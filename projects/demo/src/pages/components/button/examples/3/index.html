>

        size="xs"
        tuiAvatar="@otus.outline.user-01-lined"
    >
        <img
            alt=""
            src="https://avatars.githubusercontent.com/u/11832552"
        />
    </div>
    Alex Inkin
</button>

<button
    appearance="secondary"
    size="m"
    tuiButton
    type="button"
>
    <tui-icon icon="@otus.outline.users-01-lined" />

</button>

<button
    appearance="outline"
    size="s"

    type="button"
>

</button>

<button
    iconStart="@otus.outline.help-circle-lined"
    size="m"
    tuiIconButton
    type="button"
>
    Help
</button>

<button
    appearance="secondary-destructive"

    size="xs"
    tuiIconButton
    type="button"
    [style.border-radius.%]="100"
>
    Favorite
</button>
