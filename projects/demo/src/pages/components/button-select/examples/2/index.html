<button
    appearance="secondary-grayscale"
    iconStart="@otus.outline.user-01-lined"
    size="m"
    tuiButton
    tuiButtonSelect
    [(ngModel)]="value"
>
    {{ value.length === 1 ? value[0]?.name : `Selected ${value.length}` }}

    <tui-data-list *tuiDropdown>
        <tui-opt-group
            label="Users"
            tuiMultiSelectGroup
        >
            @for (name of items; track name.id) {
                <button
                    tuiOption
                    type="button"
                    [value]="name"
                >
                    {{ name.name }}
                </button>
            }
        </tui-opt-group>
    </tui-data-list>
</button>
