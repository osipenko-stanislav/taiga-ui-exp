<button
    tuiButton
    type="button"
    (click)="open.set(true)"
>
    Show ActionBar on top
</button>

<tui-action-bar *tuiPopup="open()">
    <span>Action bar on top opened</span>
    <button
        iconStart="@otus.outline.trash-01-lined"
        tuiIconButton
        type="button"
        (click)="open.set(false)"
    >
        Close
    </button>
</tui-action-bar>
