<button
    size="m"
    tuiButton
    type="button"
    (click)="open = true"
>
    Show ActionBar
</button>

<tui-action-bar
    *tuiPopup="open"
    size="s"
>
    <span [style.width.%]="isMobile() ? 100 : null">Action bar opened</span>

    <button
        appearance="secondary-grayscale"
        iconStart="@otus.outline.trash-01-lined"
        tuiButton
        type="button"
        (click)="open = false"
    >
        Remove
    </button>
    <button
        iconStart="@otus.outline.x-lined"
        tuiIconButton
        type="button"
        [appearance]="isMobile() ? 'secondary-grayscale' : 'icon'"
        (click)="open = false"
    >
        Close
    </button>
</tui-action-bar>
