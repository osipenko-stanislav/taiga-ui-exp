<tui-segmented>
    @for (state of statuses; track state) {
        <button
            type="button"
            (click)="status = state"
        >
            {{ state }}
        </button>
    }
</tui-segmented>

<tui-textfield [invalid]="status === 'invalid'">
    <label tuiLabel>Card number</label>
    <input
        icon=""
        tuiInputCard
        [disabled]="status === 'disabled'"
        [readonly]="status === 'readonly'"
        [(ngModel)]="card"
    />
    @if (card.startsWith('1234')) {
        <span
            iconStart="@otus.outline.currency-dollar-lined"
            paymentSystem="visa"
            size="s"
            tuiThumbnailCard
            [style.background]="background"
        ></span>
    }
</tui-textfield>
