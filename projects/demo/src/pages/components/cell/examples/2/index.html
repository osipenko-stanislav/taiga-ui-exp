<label tuiCell>
    <tui-badged-content>
        <tui-icon
            appearance="negative"
            iconStart="@otus.outline.arrow-down-left-lined"
            size="s"
            tuiBadge
            tuiSlot="top"
        />
        <div
            size="s"
            tuiAvatar="@otus.outline.phone-lined"
        ></div>
    </tui-badged-content>
    <div
        tuiTitle
        [style.color]="'var(--tui-text-negative)'"
    >
        Allow incoming
        <div tuiSubtitle>Why would you?</div>
    </div>
    <input
        tuiSwitch
        type="checkbox"
        [(ngModel)]="incoming"
    />
</label>
<label tuiCell>
    <tui-badged-content>
        <tui-icon
            appearance="positive"
            iconStart="@otus.outline.arrow-up-right-lined"
            size="s"
            tuiBadge
            tuiSlot="top"
        />
        <div
            size="s"
            tuiAvatar="@otus.outline.phone-lined"
        ></div>
    </tui-badged-content>
    <div tuiTitle>Allow outgoing</div>
    <input
        tuiSwitch
        type="checkbox"
        [(ngModel)]="outgoing"
    />
</label>
