<tui-app-bar tuiAppBarSize>
    <button
        iconStart="@otus.outline.chevron-left-lined"
        tuiButton
        tuiSlot="start"
        type="button"
    >
        Action
    </button>
    Taiga UI
</tui-app-bar>

<tui-app-bar tuiAppBarSize>
    <label tuiTitle>
        Taiga UI
        <span tuiSubtitle>Components library</span>
    </label>
    <button
        tuiButton
        tuiSlot="end"
        type="button"
    >
        Action
    </button>
</tui-app-bar>

<tui-app-bar size="l">
    <button
        tuiButton
        tuiSlot="start"
        type="button"
    >
        Action
    </button>
    <label tuiTitle>
        Taiga UI is a very long title that should fade away
        <span tuiSubtitle>Components library</span>
    </label>
    <button
        iconStart="@otus.outline.x-lined"
        tuiIconButton
        tuiSlot="end"
        type="button"
    >
        Close
    </button>
</tui-app-bar>

<tui-app-bar size="l">
    <button
        iconStart="@otus.outline.chevron-left-lined"
        size="xs"
        tuiIconButton
        tuiSlot="start"
        type="button"
    >
        Back
    </button>
    <progress
        size="s"
        tuiProgressBar
        [max]="100"
        [style.width.rem]="10"
        [value]="35"
    ></progress>
    <button
        tuiButton
        tuiSlot="end"
        type="button"
    >
        Action
    </button>
</tui-app-bar>
