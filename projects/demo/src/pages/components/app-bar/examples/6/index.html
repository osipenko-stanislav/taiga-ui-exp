<section tuiPlatform="ios">
    <tui-app-bar>
        <button
            tuiButton
            tuiSlot="start"
            type="button"
        >
            Back
        </button>
        Taiga UI
        <button
            tuiButton
            tuiSlot="end"
            type="button"
        >
            Action
        </button>
    </tui-app-bar>

    <tui-app-bar>
        <button
            tuiAppBarBack
            tuiSlot="start"
            type="button"
        >
            Back
        </button>
        Taiga UI — Components library
        <button
            iconStart="@otus.outline.user-01-lined"
            tuiIconButton
            tuiSlot="end"
            type="button"
        >
            User
        </button>
    </tui-app-bar>

    <tui-app-bar>
        <button
            title="Back"
            tuiAppBarBack
            tuiSlot="start"
            type="button"
        ></button>
        Taiga UI
        <button
            iconStart="@otus.outline.user-01-lined"
            tuiIconButton
            tuiSlot="end"
            type="button"
        >
            User
        </button>
        <button
            iconStart="@otus.outline.settings-01-lined"
            title="Settings"
            tuiIconButton
            tuiSlot="end"
            type="button"
        ></button>
    </tui-app-bar>

    <tui-app-bar>
        <label tuiTitle>
            Taiga UI
            <span tuiSubtitle>Components library</span>
        </label>
        <button
            iconStart="@otus.outline.settings-01-lined"
            title="Settings"
            tuiIconButton
            tuiSlot="end"
            type="button"
        ></button>
    </tui-app-bar>

    <tui-app-bar>
        <button
            tuiAppBarBack
            tuiSlot="start"
            type="button"
        >
            Back
        </button>

        <div>
            <progress
                size="s"
                tuiProgressBar
                [max]="100"
                [value]="35"
            ></progress>
        </div>
    </tui-app-bar>
</section>
