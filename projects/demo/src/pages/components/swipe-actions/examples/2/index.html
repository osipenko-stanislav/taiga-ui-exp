<tui-swipe-actions [style.--tui-actions-padding.rem]="1">
    <div
        tuiSurface
        class="blur"
    >
        <div tuiAvatar="@otus.outline.user-01-lined">
            <img
                alt=""
                src="assets/images/avatar.jpg"
            />
        </div>
        <h3 tuiTitle="m">Alex Inkin</h3>
    </div>

    <input
        tuiSwipeAction
        tuiSwitch
        type="checkbox"
        [(ngModel)]="checkbox"
    />
    <button
        appearance="secondary-destructive"
        iconStart="@otus.outline.trash-01-lined"
        size="m"
        tuiIconButton
        tuiSwipeAction
        type="button"
        [style.borderRadius.%]="100"
    >
        Trash
    </button>
</tui-swipe-actions>
