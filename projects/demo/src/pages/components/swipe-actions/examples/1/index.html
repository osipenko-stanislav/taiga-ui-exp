<tui-swipe-actions>
    <div
        appearance="floating"
        tuiCardLarge
        tuiCell
    >
        <div
            appearance="primary"
            tuiAvatar="@otus.outline.currency-dollar-lined"
        ></div>
        <div tuiTitle>
            <strong>{{ 10000 | tuiAmount: 'USD' }}</strong>
            <div tuiSubtitle>Dollar account</div>
        </div>
    </div>

    <button
        iconStart="@otus.outline.eye-lined"
        size="m"
        tuiIconButton
        tuiSwipeAction
        type="button"
    >
        Show
    </button>
    <button
        iconStart="@otus.outline.pencil-line-lined"
        size="m"
        tuiIconButton
        tuiSwipeAction
        type="button"
    >
        Edit
    </button>
    <button
        appearance="secondary"
        iconStart="@otus.outline.share-01-lined"
        size="m"
        tuiIconButton
        tuiSwipeAction
        type="button"
    >
        Share
    </button>
</tui-swipe-actions>

<tui-swipe-actions>
    <div
        appearance="floating"
        tuiCardLarge
        tuiCell
    >
        <div
            appearance="primary"
            tuiAvatar="@otus.outline.gift-01-lined"
        ></div>
        <div tuiTitle>
            <strong>{{ 23000 | tuiAmount: 'EUR' }}</strong>
            <div tuiSubtitle>Goal</div>
        </div>
    </div>

    <button
        iconStart="@otus.outline.eye-lined"
        size="m"
        tuiIconButton
        tuiSwipeAction
        type="button"
    >
        Show
    </button>
</tui-swipe-actions>

<tui-swipe-actions
    [style.--tui-action-gap]="16"
    [style.--tui-item-size]="32"
>
    <div
        appearance="floating"
        tuiCardLarge
        tuiCell
    >
        <div
            appearance="primary"
            tuiAvatar="@otus.outline.briefcase-01-lined"
        ></div>
        <div tuiTitle>
            <strong>{{ 5000 | tuiAmount: 'EUR' }}</strong>
            <div tuiSubtitle>Vacations</div>
        </div>
    </div>

    <button
        iconStart="@otus.outline.eye-lined"
        size="s"
        tuiIconButton
        tuiSwipeAction
        type="button"
    >
        Show
    </button>
    <button
        iconStart="@otus.outline.pencil-line-lined"
        size="s"
        tuiIconButton
        tuiSwipeAction
        type="button"
    >
        Edit
    </button>
    <button
        appearance="secondary"
        iconStart="@otus.outline.share-01-lined"
        size="s"
        tuiIconButton
        tuiSwipeAction
        type="button"
    >
        Share
    </button>
    <button
        appearance="secondary-destructive"
        iconStart="@otus.outline.trash-01-lined"
        size="s"
        tuiIconButton
        tuiSwipeAction
        type="button"
    >
        Delete
    </button>
</tui-swipe-actions>
