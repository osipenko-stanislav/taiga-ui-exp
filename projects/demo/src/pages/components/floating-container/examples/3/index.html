<p>
    <label tuiLabel>
        <input
            tuiSwitch
            type="checkbox"
            [(ngModel)]="floating"
        />
        Floating visibility
    </label>
</p>

<p>
    <label tuiLabel>
        <input
            tuiSwitch
            type="checkbox"
            [(ngModel)]="additional"
        />
        Additional content
    </label>
</p>

<div class="content">
    @for (_ of '-'.repeat(30); track $index) {
        <div tuiCell>
            <div
                appearance="primary"
                tuiAvatar="@otus.outline.star-01-lined"
            ></div>
            <div tuiTitle>
                Title
                <div tuiSubtitle>Description</div>
            </div>
        </div>
    }

    @if (floating) {
        <footer tuiFloatingContainer>
            <button
                tuiButton
                type="button"
            >
                Main action
            </button>
            <tui-elastic-container>
                <div tuiSlides>
                    @if (additional) {
                        <button
                            appearance="flat"
                            tuiButton
                            type="button"
                        >
                            Secondary action
                        </button>
                    } @else {
                        <div class="clamp">
                            <tui-icon
                                icon="@otus.outline.settings-01-lined"
                                [style.font-size.rem]="1"
                            />
                            Legal text, max 3 lines
                        </div>
                    }
                </div>
            </tui-elastic-container>
        </footer>
    }
</div>
