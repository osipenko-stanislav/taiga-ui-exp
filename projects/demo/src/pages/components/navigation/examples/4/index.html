<!-- Ignore this part, it is only here to position drawer inside the example block -->
<div class="custom-portal">
    <ng-container tuiVCR />
</div>
<header
    tuiNavigationHeader
    tuiTheme="light"
>
    <button
        title="Menu"
        tuiIconButton
        tuiNavigationDrawer
        type="button"
    >
        <div
            tuiTheme="light"
            class="drawer"
            [style.padding.rem]="0.5"
        >
            <span tuiTitle>
                Drawer content
                <span tuiSubtitle>Arbitrary content</span>
            </span>
        </div>
    </button>
</header>
<div [style.display]="'flex'">
    <aside
        tuiTheme="light"
        [style.height.rem]="27"
        [tuiNavigationAside]="true"
    >
        <header>
            <button
                iconStart="@otus.outline.home-01-lined"
                tuiAsideItem
                type="button"
            >
                <span tuiFade>A very very long product name</span>
            </button>
        </header>
        <button
            iconStart="@otus.outline.search-md-lined"
            tuiAsideItem
            type="button"
        >
            Search
        </button>
        <button
            iconStart="@otus.outline.users-01-lined"
            tuiAsideItem
            type="button"
        >
            Groups
        </button>
        <tui-aside-group [(open)]="open">
            <button
                iconStart="@otus.outline.settings-01-lined"
                tuiAsideItem
                tuiChevron
                type="button"
            >
                Settings
                <ng-template>
                    <button
                        tuiAsideItem
                        type="button"
                        (click)="open = false"
                    >
                        Account
                    </button>
                    <button
                        tuiAsideItem
                        type="button"
                        (click)="open = false"
                    >
                        Notifications
                    </button>
                    <button
                        tuiAsideItem
                        type="button"
                        (click)="open = false"
                    >
                        Privacy
                    </button>
                </ng-template>
            </button>
        </tui-aside-group>
        <button
            iconStart="@otus.outline.heart-lined"
            tuiAsideItem
            type="button"
        >
            <span tuiFade>By default ellipsis is used but you can use fade too</span>
        </button>
        <hr />
        <button
            appearance="primary"
            iconStart="@otus.outline.plus-lined"
            tuiAsideItem
            type="button"
        >
            Add
        </button>
        <footer>
            <button
                iconStart="@otus.outline.star-01-lined"
                tuiAsideItem
                type="button"
            >
                Favorites
            </button>
        </footer>
    </aside>
    <main tuiNavigationMain>
        @for (_ of '-'.repeat(10); track $index) {
            <div
                appearance="floating"
                tuiCardLarge
                tuiHeader
            >
                <h2 tuiTitle>
                    Some random content
                    <span tuiSubtitle>A subtitle</span>
                </h2>
            </div>
        }
    </main>
</div>
