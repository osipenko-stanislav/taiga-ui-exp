<label tuiInputFiles>
    <input
        tuiInputFiles
        [formControl]="control"
    />
    <ng-template let-dragged>
        @if (dragged) {
            <div
                appearance="secondary"
                size="l"
                tuiAvatar="@otus.outline.droplets-01-lined"
            ></div>
            <div>
                Drop it like it's hot!
                <br />
                <br />
            </div>
        } @else {
            <div
                appearance="secondary"
                size="l"
                tuiAvatar="@otus.outline.upload-cloud-01-lined"
            ></div>
            <div>
                Drag and drop file here or
                <a tuiLink>click to upload</a>
            </div>
            <div class="types">PNG, JPG, JPEG, PNG, etc</div>
        }
    </ng-template>
</label>

<tui-files class="tui-space_top-4">
    <tui-file
        [file]="file"
        [leftContent]="content"
    >
        <span class="tui-text_body-s-2">file is on checking</span>
    </tui-file>
</tui-files>

<ng-template #content>
    <tui-icon icon="@otus.outline.clock-lined" />
</ng-template>
