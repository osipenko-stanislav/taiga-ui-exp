<button
    tuiButton
    type="button"
    (click)="open = true"
>
    Open
</button>

<ng-template
    let-observer
    [tuiResponsiveDialogOptions]="{appearance: 'fullscreen', bar: false}"
    [(tuiResponsiveDialog)]="open"
>
    <tui-pdf-viewer>
        <h2 tuiTitle>file.pdf</h2>

        <button
            iconStart="@otus.outline.pen-tool-01-lined"
            tuiButton
            type="button"
            [title]="isMobile ? 'Sign' : ''"
            (click)="observer.complete(); alerts.open('Document signed').subscribe()"
        >
            {{ isMobile ? '' : 'Sign' }}
        </button>

        <button
            iconStart="@otus.outline.download-01-lined"
            tuiButton
            type="button"
            [title]="isMobile ? 'Download' : ''"
            (click)="observer.complete()"
        >
            {{ isMobile ? '' : 'Download' }}
        </button>

        <iframe [src]="url"></iframe>
    </tui-pdf-viewer>
</ng-template>
