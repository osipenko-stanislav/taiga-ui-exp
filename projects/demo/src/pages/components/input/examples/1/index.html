<tui-textfield
    iconEnd="@otus.outline.settings-01-lined"
    iconStart="@otus.outline.search-md-lined"
>
    <label tuiLabel>I am a label</label>
    <input
        placeholder="I am placeholder"
        tuiInput
        [(ngModel)]="value"
    />
    <tui-icon icon="@otus.outline.bell-01-lined" />
    <tui-icon tuiTooltip="I am a hint" />
</tui-textfield>

<label tuiLabel>
    For long labels it is better to use label outside as it can wrap to multiple lines
    <tui-textfield
        #m
        iconEnd="@otus.outline.settings-01-lined"
        iconStart="@otus.outline.search-md-lined"
        tuiTextfieldSize="m"
    >
        <input
            tuiInput
            [placeholder]="m.focused() ? 'I am placeholder' : 'I am a label'"
            [(ngModel)]="value"
        />
        <tui-icon icon="@otus.outline.bell-01-lined" />
        <tui-icon tuiTooltip="I am a hint" />
    </tui-textfield>
</label>

<tui-textfield
    #s
    iconEnd="@otus.outline.settings-01-lined"
    iconStart="@otus.outline.search-md-lined"
    tuiTextfieldSize="s"
>
    <input
        tuiInput
        [placeholder]="s.focused() ? 'I am placeholder' : 'I am a label'"
        [(ngModel)]="value"
    />
    <tui-icon icon="@otus.outline.bell-01-lined" />
    <tui-icon tuiTooltip="I am a hint" />
</tui-textfield>
