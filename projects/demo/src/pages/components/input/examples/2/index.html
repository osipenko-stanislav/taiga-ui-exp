<tui-textfield iconStart="@otus.outline.search-md-lined">
    <label tuiLabel>Disabled</label>
    <input
        tuiInput
        [disabled]="true"
        [(ngModel)]="value"
    />
    <tui-icon tuiTooltip="Disabled does not show tooltip" />
</tui-textfield>
<tui-textfield iconStart="@otus.outline.search-md-lined">
    <label tuiLabel>Read-only</label>
    <input
        placeholder="I am placeholder"
        tuiInput
        [readonly]="true"
        [(ngModel)]="value"
    />
    <tui-icon tuiTooltip="Readonly shows tooltip" />
</tui-textfield>
<tui-textfield
    iconStart="@otus.outline.search-md-lined"
    [invalid]="true"
>
    <label tuiLabel>Invalid</label>
    <input
        placeholder="I am placeholder"
        tuiInput
        [(ngModel)]="value"
    />
    <tui-icon tuiTooltip="Can also follow Angular validation" />
</tui-textfield>
