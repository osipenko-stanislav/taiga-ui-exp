<tui-input-range
    [formControl]="control"
    [max]="100"
    [min]="0"
    [postfix]="['%', '%']"
    [segments]="5"
    [step]="20"
>
    Select volume range
</tui-input-range>

<div class="ticks-labels">
    <tui-icon icon="@otus.outline.volume-x-lined" />
    <span>20%</span>
    <span>40%</span>
    <span>60%</span>
    <span>80%</span>
    <tui-icon icon="@otus.outline.volume-max-lined" />
</div>
